# 로컬 개발·시험용 PostgreSQL 17 + pgvector (ADR-006)
# 실행: docker compose up -d db   (POSTGRES_PASSWORD 는 .env 에서 읽는다. 이 파일에 비밀번호를 쓰지 않는다)
name: lawqa

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lawqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: lawqa
    ports:
      # 호스트 포트는 .env 의 POSTGRES_PORT (기본 5432). 다른 DB가 5432를 쓰면 바꾸고 DATABASE_URL 도 맞춘다
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lawqa_pgdata:/var/lib/postgresql/data
    configs:
      # 볼륨이 비어 있을 때(첫 기동) 한 번만 실행된다
      - source: create_test_db
        target: /docker-entrypoint-initdb.d/01-create-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawqa -d lawqa"]
      interval: 5s
      timeout: 3s
      retries: 20

configs:
  create_test_db:
    content: |
      CREATE DATABASE lawqa_test OWNER lawqa;

volumes:
  lawqa_pgdata:
