# 모든 실험 설정의 단일 출처. 값을 바꾸면 versions.* 도 올려서 기록에 남깁니다.
versions:
  docs: "docs-v0.1"        # data/documents.csv 및 원문 버전
  index: "index-v0.1"      # 청킹/임베딩 설정이 바뀌면 올림
  prompt: "prompt-v0.1"    # src/kant_rag/generation/prompts.py 변경 시 올림
  eval: "eval-v0.1"        # eval/*.json 고정 버전

paths:
  manifest: data/documents.csv
  raw_dir: data/raw
  index_dir: index
  results_dir: results
  cache_db: results/cache.sqlite

chunking:
  chunk_size: 500          # 문자 기준
  chunk_overlap: 80

retrieval:
  # A: vector / B: hybrid / C: hybrid_rerank
  vector_k: 20             # 벡터 후보 수
  bm25_k: 20               # BM25 후보 수
  rrf_k: 60                # RRF 상수 (score = Σ 1/(rrf_k + rank))
  fused_k: 20              # 결합 후 reranker 로 넘길 후보 수
  final_k: 5               # 최종 근거 개수 (Hit@5 기준)
  bm25_tokenizer: simple   # simple | kiwi  (kiwi 는 `uv sync --extra ko`)

rerank:
  # reranker 점수가 이 값 미만이면 '근거 부족' 후보로 판단 (개발셋으로만 튜닝)
  min_score: 0.2

generation:
  max_context_chunks: 5
  max_context_chars: 4000
  max_tokens: 1024

optimization:
  cache:
    enabled: false         # A/B/C 품질 비교 시에는 반드시 false
    ttl_seconds: 86400
  rewrite:
    enabled: false
