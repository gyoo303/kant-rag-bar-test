# 교안 2-5 기준: PostgreSQL 17 + pgvector
# 교안의 계정 정보 불일치(postgress/password/postgres)는 .env 기준 postgres/postgres 로 통일
services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: civil-rag-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
