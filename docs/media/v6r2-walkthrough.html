<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v6r2 문항 처리 과정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1420; --panel:#161d2c; --panel2:#1c2537; --line:#2a3550; --text:#e8ecf4; --muted:#93a0bb;
  --accent:#5aa9ff; --ok:#3ccf91; --warn:#ffb547; --bad:#ff6b6b; --violet:#b48cff; --chip:#22304a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",sans-serif;overflow:hidden;height:100%}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:50%;transform-origin:center;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--bg)}
header{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);gap:16px}
header .t{font-size:22px;font-weight:900;letter-spacing:-.3px}
header .t b{color:var(--accent)}
header .sub{color:var(--muted);font-size:14px}
header .badge{margin-left:auto}
.badge{font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid}
.b-real{color:var(--ok);border-color:var(--ok);background:#3ccf9114}
.b-raw{color:var(--accent);border-color:var(--accent);background:#5aa9ff14}
.b-demo{color:var(--warn);border-color:var(--warn);background:#ffb54714}
/* pipeline */
#pipe{position:absolute;left:20px;top:84px;width:250px;bottom:84px}
.node{position:relative;height:38px;margin-bottom:5px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;padding:0 12px 0 40px;font-size:14px;color:var(--muted);transition:all .4s}
.node .n{position:absolute;left:10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center}
.node .tag{margin-left:auto;font-size:11px;color:var(--violet)}
.node.done{color:var(--text);border-color:#2f4a3d}
.node.done .n{background:var(--ok);border-color:var(--ok);color:#0b1a12}
.node.cur{color:#fff;border-color:var(--accent);background:#1b2b47;box-shadow:0 0 0 3px #5aa9ff33;transform:translateX(6px)}
.node.cur .n{background:var(--accent);border-color:var(--accent);color:#06121f}
/* main */
#main{position:absolute;left:290px;right:24px;top:84px;bottom:84px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;overflow:hidden}
#main h2{font-size:22px;font-weight:900;margin-bottom:4px}
#main h2 small{font-size:14px;color:var(--muted);font-weight:500;margin-left:10px}
.desc{color:var(--muted);font-size:14px;margin-bottom:14px}
footer{position:absolute;left:0;right:0;bottom:0;height:72px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:18px}
#cap{font-size:17px;font-weight:500;flex:1;line-height:1.45}
#bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0}
#clock{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
#ctrl{display:flex;gap:6px}
#ctrl button{background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
body.rec #ctrl{display:none}
/* atoms */
[data-t]{opacity:0;transform:translateY(8px);transition:opacity .45s, transform .45s}
[data-t].on{opacity:1;transform:none}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row{display:flex;gap:12px}
.col{display:flex;flex-direction:column;gap:8px}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;margin:0 6px 6px 0}
.chip.a{border-color:var(--accent);color:var(--accent)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.w{border-color:var(--warn);color:var(--warn)}
.chip.b{border-color:var(--bad);color:var(--bad)}
.mono{font-family:"Noto Sans KR",monospace;font-size:13px}
.k{color:var(--accent);font-weight:700}
.stm{font-size:13.5px;line-height:1.55;padding:6px 10px;border-left:3px solid var(--line);margin-bottom:6px}
.stm b{color:var(--accent)}
.hl{background:#ffb5472e;border-radius:3px;padding:0 2px}
.hl2{background:#3ccf912e;border-radius:3px;padding:0 2px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.T{color:var(--ok);font-weight:700}.F{color:var(--bad);font-weight:700}.U{color:var(--warn);font-weight:700}
.rank{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px;font-size:13.5px;transition:transform .7s}
.rank .r{width:22px;height:22px;border-radius:6px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:12px}
.rank.gold{border-color:var(--ok)} .rank.gold .r{background:var(--ok);color:#06140d}
.rank .src{margin-left:auto;font-size:11.5px;color:var(--muted)}
.arrow{color:var(--muted);font-size:22px;align-self:center}
.big{font-size:44px;font-weight:900}
.optg{display:grid;grid-template-columns:70px repeat(4,1fr) 90px;gap:4px;font-size:13.5px}
.optg div{padding:7px 8px;background:var(--panel2);border-radius:6px;text-align:center}
.optg .h{background:none;color:var(--muted);font-size:12.5px}
.optg .m{outline:2px solid var(--bad)}
.optg .best{background:#3ccf9122;outline:1px solid var(--ok)}
.check{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;font-size:14px}
.check .ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.ic.ok{background:var(--ok);color:#06140d}.ic.w{background:var(--warn);color:#1c1200}
.seg{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#06121f;font-weight:700}
svg text{font-family:"Noto Sans KR",sans-serif}
.title-scene{display:flex;flex-direction:column;justify-content:center;height:100%;gap:18px}
.title-scene .h1{font-size:40px;font-weight:900;line-height:1.25}
.title-scene .h1 span{color:var(--accent)}
.legend{display:flex;gap:10px;margin-top:8px}
</style>
</head>
<body>
<div id="stage">
  <header><div class="t"><b>v6r2</b> 문항 하나를 푸는 과정</div><div class="sub">제11회(2022) 민사법 선택형 문 24 · 2022 색인</div><div class="badge" id="badge"></div></header>
  <div id="pipe"></div>
  <div id="main"></div>
  <footer><div id="cap"></div><div id="clock"></div><div id="ctrl"><button id="prev">◀</button><button id="play">❚❚</button><button id="next">▶</button></div><div id="bar"></div></footer>
</div>
<script>
const NODES=[["입력 파싱",""],["기준일",""],["질의 생성",""],["검색·리랭크",""],["원문 결과 보장","②"],["연결 지도",""],["판단 입력 조립",""],["1차 판단 (v7)","③"],["정답 계산",""],["검사 4종","①③④"],["2차 검색·재판단","⑤⑥"],["최종 결과",""]];
const B={real:['b-real','실측'],raw:['b-raw','원자료 실측'],demo:['b-demo','시연 (예시 값)'],mix:['b-demo','실측 + 시연']};
const S=[
{n:-1,d:7,b:'real',cap:'v6r2 가 실제 시험 문항 하나를 어떻게 처리하는지, 단계마다 중간 출력물을 따라가 봅니다.',h:`
<div class="title-scene">
 <div class="h1" data-t="0.2">문항 하나가 정답이 되기까지<br><span>v6r2 파이프라인 12단계</span></div>
 <div class="desc" data-t="1.0" style="font-size:16px">샘플: 2022 제11회 민사법 선택형 <b>문 24</b> (지연손해금, ○× 조합형)<br>v6 가 지문 ㄷ 을 <b>근거 판례를 인용하고도 거짓</b>으로 판단했던 문항 — v6r2 가 겨냥한 사례</div>
 <div class="legend" data-t="2.0"><span class="badge b-real">실측: 실행 기록·코드 계산</span><span class="badge b-raw">원자료 실측: 2022 코퍼스</span><span class="badge b-demo">시연: v6r2 동작을 보여 주는 예시 값</span></div>
</div>`},
{n:0,d:9,b:'real',cap:'① 시험지 텍스트를 문항 구조로 바꿉니다. 지문 4개, ○× 조합형, 보기 5개. 정답은 입력에 넣지 않습니다.',h:`
<h2>입력 파싱<small>parse.py · ExamQuestion</small></h2><div class="desc">발문 · 지문 · 보기를 나누고 형식·극성을 판정</div>
<div class="row"><div class="col" style="flex:1.35">
 <div class="card" data-t="0.3" style="font-size:14px">지연손해금에 관한 설명 중 옳은 것(○)과 옳지 않은 것(×)을 올바르게 조합한 것은?</div>
 <div data-t="0.9" class="stm"><b>ㄱ</b> 이행기 없는 채권의 양수인이 소 제기 후 소송 중 양도통지 → 소장부본 송달 다음날부터 지체책임</div>
 <div data-t="1.3" class="stm"><b>ㄴ</b> 불법행위 손해배상채무는 채무 성립과 동시에 지연손해금 발생</div>
 <div data-t="1.7" class="stm"><b>ㄷ</b> 지연손해금 비율 약정은 손해배상액의 예정으로 <span class="hl">추정</span>되고, 부당히 과다하면 감액</div>
 <div data-t="2.1" class="stm"><b>ㄹ</b> 소송촉진법 이율이 바뀌면 후소에서 선행판결과 다른 금액 인정 가능</div>
</div><div class="col" style="flex:1">
 <div class="card" data-t="2.8"><div class="mono" style="color:var(--muted);margin-bottom:6px">보기</div>
 ① ㄱ○ ㄴ× ㄷ× ㄹ○<br>② ㄱ○ ㄴ○ ㄷ○ ㄹ×<br>③ ㄱ× ㄴ× ㄷ○ ㄹ×<br>④ ㄱ× ㄴ○ ㄷ○ ㄹ○<br>⑤ ㄱ× ㄴ○ ㄷ○ ㄹ×</div>
 <div data-t="3.8"><span class="chip a">form = ox</span><span class="chip a">지문 4개</span><span class="chip a">보기 5개</span><span class="chip">정답 비공개 (채점 때만)</span></div>
</div></div>`},
{n:1,d:7,b:'real',cap:'② 발문에 기준 시점이 없으므로 시험 기준일(2022. 1. 10.)을 씁니다. 이 날 뒤 선고된 판례는 검색에서 빠집니다.',h:`
<h2>기준일 정하기<small>asof_from_stem · asof_default</small></h2><div class="desc">"YYYY. M. D. 당시/현재/기준" 을 발문에서 찾고, 없으면 시험 기준일</div>
<div class="row" style="align-items:center;gap:22px;margin-top:20px">
 <div class="card" data-t="0.4" style="flex:1;font-size:15px">발문에서 날짜 찾기<br><span class="chip w" style="margin-top:8px">없음</span></div>
 <div class="arrow" data-t="1.2">→</div>
 <div class="card" data-t="1.6" style="flex:1;font-size:15px">시험 기준일 (설정)<br><span class="chip ok" style="margin-top:8px">asof = 2022-01-10</span></div>
 <div class="arrow" data-t="2.4">→</div>
 <div class="card" data-t="2.8" style="flex:1.3;font-size:14px">검색·연결에서 <b>선고일 &gt; 2022-01-10</b> 판례 제외<br>판례 변경 표시도 기준일 뒤 판례는 숨김 (<span class="mono">hide_future</span>)</div>
</div>`},
{n:2,d:10,b:'demo',cap:'③ 지문마다 검색 질의를 여러 개 만듭니다. LLM 이 쟁점·예외·당사자 지위 질의를 만들고, 지문 원문 질의를 따로 더합니다.',h:`
<h2>질의 생성 — 지문 ㄷ<small>리라이트 v4 + 원문 질의</small></h2><div class="desc">질의마다 따로 검색해 순위를 합친다 (RRF). 원문 질의는 리라이트가 흔들려도 근거를 놓치지 않게 하는 안전장치</div>
<div class="col" style="gap:10px;margin-top:6px">
 <div class="card" data-t="0.4"><span class="chip ok">원문</span> 금전채무에 관하여 이행지체에 대비한 지연손해금 비율을 따로 약정한 경우에 이는 손해배상액의 예정으로 추정되고 …</div>
 <div class="card" data-t="1.4"><span class="chip a">쟁점</span> 지연손해금 비율 약정 손해배상액의 예정 추정 여부 감액</div>
 <div class="card" data-t="2.2"><span class="chip a">예외</span> 위약벌 약정 손해배상액 예정 아닌 경우 감액 불가</div>
 <div class="card" data-t="3.0"><span class="chip a">당사자</span> 금전채무 채무자 지체 지연손해금 약정 민법 제398조</div>
 <div data-t="4.0" class="desc" style="margin-top:4px">※ 리라이트 문장은 예시입니다 (실행마다 LLM 이 조금씩 다르게 씀). 원문 질의는 실제 지문 그대로.</div>
</div>`},
{n:3,d:12,b:'real',cap:'④ 키워드(BM25)와 의미(bge-m3 벡터) 검색 결과를 합치고, 리랭커가 지문과 다시 대조해 순위를 매깁니다. 정답 근거 2016다52265 가 상위에 있습니다.',h:`
<h2>하이브리드 검색 → 리랭크 — 지문 ㄷ<small>BM25 + bge-m3 → RRF → bge-reranker-v2-m3</small></h2><div class="desc">왼쪽: 키워드 검색만 (2022 코퍼스 실측) · 오른쪽: 실제 실행의 최종 순위 (hybrid_rerank)</div>
<div class="row" style="gap:20px">
 <div style="flex:1"><div class="desc" data-t="0.2">BM25 상위 5</div>
  <div class="rank gold" data-t="0.5"><span class="r">1</span>2016다52265 [1] · 손해배상액의 예정으로서 감액 대상<span class="src">정답 근거</span></div>
  <div class="rank" data-t="0.8"><span class="r">2</span>2017다228762 [3]</div>
  <div class="rank" data-t="1.1"><span class="r">3</span>2017다206922 [1]</div>
  <div class="rank" data-t="1.4"><span class="r">4</span>2016다275402 [1]</div>
  <div class="rank" data-t="1.7"><span class="r">5</span>99다38637 [2]</div>
 </div>
 <div class="arrow" data-t="2.6">⟶</div>
 <div style="flex:1"><div class="desc" data-t="3.0">리랭크 후 상위 5 (지문당 판단 입력)</div>
  <div class="rank" data-t="3.4"><span class="r">1</span>2017다206922 [1] · "일종의 손해배상액의 예정"</div>
  <div class="rank gold" data-t="3.8"><span class="r">2</span>2016다52265 [1]<span class="src">정답 근거</span></div>
  <div class="rank" data-t="4.2"><span class="r">3</span>2017다228762 [3]</div>
  <div class="rank" data-t="4.6"><span class="r">4</span>2016다275402 [1]</div>
  <div class="rank" data-t="5.0"><span class="r">5</span>98다45546 [4]</div>
 </div>
</div>
<div class="desc" data-t="6.2" style="margin-top:8px">다섯 판례 모두 같은 법리 — "지연손해금 비율 약정 = 손해배상액의 예정 → 감액 대상". 검색은 성공했다. 문제는 다음 판단 단계에서 생긴다.</div>`},
{n:4,d:8,b:'real',cap:'⑤ v6r2 ②: 원문 질의의 상위 2개가 최종 상위 5 안에 반드시 남게 합니다. 이 문항은 이미 들어 있어 교체가 없습니다.',h:`
<h2>원문 질의 결과 보장<small>v6r2 ② original_keep = 2</small></h2><div class="desc">리라이트 질의를 합친 순위에서 원문 질의 상위 결과가 밀려나면 뒤쪽과 바꿔 넣는다 (v6 문 11 ㄹ 검색 변동 대응)</div>
<div class="row" style="gap:16px;margin-top:14px">
 <div class="card" data-t="0.4" style="flex:1">원문 질의 상위 2<br><span class="chip ok" style="margin-top:8px">2016다52265 [1]</span><span class="chip ok">2017다228762 [3]</span></div>
 <div class="arrow" data-t="1.4">?</div>
 <div class="card" data-t="1.8" style="flex:1">최종 상위 5 안에 있는가<br><span class="chip ok" style="margin-top:8px">2위 ✓</span><span class="chip ok">3위 ✓</span></div>
 <div class="arrow" data-t="2.8">→</div>
 <div class="card" data-t="3.2" style="flex:1"><span class="chip a">교체 없음</span><div class="desc" style="margin-top:6px">밀려났다면 상위 5 의 마지막 자리와 바꾸고 <span class="mono">original_kept</span> 에 기록</div></div>
</div>`},
{n:5,d:11,b:'raw',cap:'⑥ 원자료의 참조판례·참조조문·조문 제목으로 검색 결과에서 연결된 근거를 찾고, 리랭커로 지문과 맞는 것만 더합니다.',h:`
<h2>연결 지도 — 지문 ㄷ<small>참조판례 · 참조조문 · 조문 제목 (2022 코퍼스 실측)</small></h2><div class="desc">검색에 안 걸린 근거를 원자료의 연결 관계로 끌어온다. 후보 중 지문과 리랭커 점수가 높은 것만 진술당 2개</div>
