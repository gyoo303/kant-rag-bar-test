[project]
name = "kant-rag"
version = "0.1.0"
description = "업무 문서 기반 Knowledge Agent (BM25+Vector 하이브리드 검색, re-ranking, 캐싱/쿼리 리라이트, 평가)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
]

[project.optional-dependencies]
# 한국어 형태소 기반 BM25 토크나이저 (선택)
ko = ["kiwipiepy>=0.18"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
kant-rag = "kant_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kant_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
